# Builds both packages on every push/PR with the same pinned actions as release.yml,
# so an action bump is proven here before a release needs approval. Never publishes.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Python package builds
        run: |
          cp README.md LICENSE python/
          cd python && uv build --out-dir ../dist
      - name: npm package packs
        run: |
          cp README.md LICENSE js/
          cd js && npm pack --dry-run
