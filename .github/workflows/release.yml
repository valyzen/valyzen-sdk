# Publishes through trusted publishing (GitHub OIDC): no registry tokens anywhere.
# PyPI trusts valyzen/valyzen-sdk + release.yml + environment "pypi";
# npm trusts the same repo + workflow (configured per package on npmjs.com).
# Both environments accept deployments from main only and need the owner's approval;
# actions are pinned to commit SHAs; checkout keeps no credentials.
name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which registry to publish to
        type: choice
        options: [pypi, npm, both]
        default: both

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (inputs.target == 'pypi' || inputs.target == 'both')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Test and build
        working-directory: python
        run: |
          uv sync --locked
          uv run pytest -q
          uv build --out-dir ../dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  npm:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (inputs.target == 'npm' || inputs.target == 'both')
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test, build and publish
        working-directory: js
        run: |
          npm ci --ignore-scripts  # no dependency install scripts, least of all next to an OIDC token
          npm test
          # Pre-releases (x.y.z-alpha.n) go to the "next" tag so `npm i @valyzen/sdk` stays on latest.
          tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$tag"
