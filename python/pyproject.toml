[project]
name = "valyzen"
version = "0.0.1"
description = "Python client for the Valyzen Negotiation Gateway (name reservation; client coming soon)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Valyzen", email = "engineering@valyzen.ai" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://www.valyzen.ai"
Source = "https://github.com/valyzen/valyzen-sdk"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valyzen"]
