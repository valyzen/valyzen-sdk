[project]
name = "valyzen"
dynamic = ["version"]
description = "Python client and CLI for the Valyzen Negotiation Gateway: negotiate, then verify the signed receipt offline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Valyzen", email = "engineering@valyzen.ai" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "httpx>=0.27,<1",  # 1.0 pre-releases change the API; `pip install --pre` would pull them
  "cryptography>=43",
  "rfc8785>=0.1.4",
]

[project.scripts]
valyzen = "valyzen.cli:main"

[project.urls]
Homepage = "https://www.valyzen.ai"
Source = "https://github.com/valyzen/valyzen-sdk"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/valyzen/_version.py"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long messages stay whole

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contract: talks to a live gateway (needs VALYZEN_API_KEY)"]
addopts = "-m 'not contract'"

[tool.hatch.build.targets.wheel]
packages = ["src/valyzen"]
